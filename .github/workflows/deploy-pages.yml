name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Do not cancel a release between its database transaction and Pages deployment.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publish:
    if: github.repository == 'shipshipzzz/recsys-2027-check' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate catalog and preserve existing IDs
        env:
          BASE_SHA: ${{ github.event.before }}
        run: |
          npm run data:check
          if [[ "$BASE_SHA" =~ ^[a-f0-9]{40}$ && ! "$BASE_SHA" =~ ^0+$ ]]; then
            node scripts/validate-catalog.mjs --base "$BASE_SHA"
          fi

      - name: Check code conventions
        run: |
          npm run lint
          npm run format:check

      - name: Run tests
        run: npm test

      # Build without the privileged secret before changing any cloud data.
      - name: Build and validate Pages artifact
        run: |
          npm run build
          npm run build:check

      - name: Install browser test runtime
        run: npx playwright install --with-deps chromium

      # No production network access: browser tests use isolated fixtures.
      - name: Verify desktop, mobile, accessibility and offline workflows
        run: npx playwright test

      - name: Audit production dependencies
        run: npm run audit:prod

      - name: Atomically synchronize Supabase catalog
        env:
          SUPABASE_URL: https://npqrixancnwbmzcyqafx.supabase.co
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: npm run sync:cloud -- --apply

      - name: Verify all public cloud data and permissions
        run: npm run test:cloud

      - name: Setup Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: ./dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

      - name: Verify live Pages release and assets
        timeout-minutes: 6
        run: npm run test:pages
